spring.application.name=ebank-bot
spring.profiles.default=ollama
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8058

# Configuration des connexions MCP (Microservices)
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8056/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8059/mcp

# Configuration de l'IA (Ollama en local)
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# Configuration Discord
discord.token=${DISCORD_TOKEN}
discord.timeout=60

# Configuration Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:EbankBot}

# Configuration Eureka
eureka.client.jersey.enabled=false