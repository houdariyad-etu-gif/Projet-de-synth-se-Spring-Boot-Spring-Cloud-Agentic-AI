spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - "*"
                allowedHeaders:
                  - "*"
          httpclient:
            connect-timeout: 30000
            response-timeout: 60000
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: r1
              uri: http://localhost:8056
              predicates:
                - Path=/customers/**
            - id: r2
              uri: http://localhost:8059
              predicates:
                - Path=/accounts/**
            - id: r3
              uri: http://localhost:8058
              predicates:
                - Path=/EBANK-BOT/**
              filters:
                - StripPrefix=1