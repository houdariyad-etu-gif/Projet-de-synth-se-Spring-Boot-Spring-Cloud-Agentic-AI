<div class="accounts-page">
  @if(accounts$ | async; as accountList)
  {
    <div class="table-responsive accounts-table-container">
      <table class="table table-bordered accounts-table table-hover">
        <thead>
          <tr>
            <th>ID</th><th>Balance</th><th>Date</th><th>Type</th><th>CustomerId</th>
          </tr>
        </thead>
        <tbody>
          @for (acc of accountList; track acc){
            <tr>
              <td>{{acc.id}}</td>
              <td>{{acc.balance}}</td>
              <td>{{acc.createdAt}}</td>
              <td>{{acc.type}}</td>
              <td>{{acc.customerId}}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
